# Global mise config, linked to ~/.config/mise/config.toml by the root
# mise.toml. Everything a machine needs: tools, apps, macOS settings.
# Preview any change with `mise bootstrap --dry-run`.

[tools]
node = "lts"           # the runtime: scripts/dots.mjs and every npm tool run on it
pnpm = "latest"        # the package manager: npm: tools install through it, and `pnpm dlx` replaces npx
age = "latest"           # secrets: scripts/dots.mjs secrets
gh = "latest"            # also fetches the age key (a secret gist)
fd = "latest"
fzf = "latest"
zoxide = "latest"
starship = "latest"
cloudflared = "latest"   # ssh to the Oracle VM (home/.ssh/config)
opencode = "latest"
neovim = "latest"        # LazyVim IDE (config/nvim); opencode stays the agent
"npm:@bytebase/dbhub" = "latest"   # MCP server, installed once so no agent pays a registry round trip on startup

# Only what mise can't install as a plain binary: GUI apps and fonts.
[bootstrap.packages]
"brew-cask:visual-studio-code" = { os = "macos" }
"brew-cask:brave-browser" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
"brew-cask:hiddenbar" = { os = "macos" }

"winget:Git.Git" = { os = "windows" }
"winget:Microsoft.PowerShell" = { os = "windows" }
"winget:Microsoft.VisualStudioCode" = { os = "windows" }
"winget:Brave.Brave" = { os = "windows" }
"winget:wez.wezterm" = { os = "windows" }
"winget:DEVCOM.JetBrainsMonoNerdFont" = { os = "windows" }

# zsh plugins are plain git clones, no framework and no package manager.
[bootstrap.repos]
"~/.zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }
"~/.zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git" }

[bootstrap.user]
login_shell = "/bin/zsh"

# macOS settings, captured from this Mac. Find a key with `defaults read <domain>`.
[bootstrap.macos.dock]
autohide = true
show_recents = false
apps = [
  "/Applications/Brave Browser.app",
  "/Applications/Visual Studio Code.app",
  "/Applications/Ghostty.app",
]

[bootstrap.macos.finder]
preferred_view_style = "column"
show_extensions_warning = false

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleInterfaceStyle = "Dark", AppleShowAllExtensions = true, AppleAccentColor = 3, NSAutomaticTextCompletionEnabled = false }
"com.apple.dock" = { launchanim = false, tilesize = 50.0 }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf", NewWindowTarget = "PfLo" }
"com.apple.WindowManager" = { EnableTiledWindowMargins = false, AutoHide = true, HideDesktop = true, StandardHideDesktopIcons = true, StandardHideWidgets = true, StageManagerHideWidgets = true }
"com.apple.menuextra.clock" = { ShowDate = 0 }
"com.apple.screencapture" = { showsClicks = true }

[bootstrap.hooks.post-defaults]
run = """
  {% if os() == "macos" %}
  defaults write com.apple.finder NewWindowTargetPath -string "file://$HOME/Downloads/"
  killall Dock Finder 2>/dev/null || true
  {% endif %}
"""

[settings.npm]
package_manager = "pnpm"

[env]
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_INSTALL_CLEANUP = "1"
HOMEBREW_NO_ENV_HINTS = "1"
