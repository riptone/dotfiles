"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt (context line, then a blank prompt line). Colors are the
# Pierre dark palette, matching VS Code, nvim, Ghostty and (via `theme =
# "system"`) opencode.
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration\
$time\
$line_break\
$character"""

palette = "pierre"

[palettes.pierre]
blue    = "#69b1ff"
green   = "#0dbe4e"
purple  = "#e130ac"
yellow  = "#ffca00"
red     = "#ff2e3f"
comment = "#636363"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "

[nodejs]
symbol = " "
style = "bold green"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[time]
disabled = false
style = "comment"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
