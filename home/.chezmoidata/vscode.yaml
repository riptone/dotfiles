# VS Code profiles. `location` is VS Code's profile folder id under
# User/profiles/, used to link settings; the save script resolves profiles by
# name, so a machine where VS Code picked another id still saves.
# Refresh the extension lists with: node scripts/vscode-save-extensions.mjs
vscode:
  extensions:        # the default profile (empty; themes live per profile)
  profiles:
    - name: Home
      location: "-45339981"
      icon: home
      extensions:
        - aaron-bond.better-comments
        - anthropic.claude-code
        - biomejs.biome
        - formulahendry.auto-close-tag
        - formulahendry.auto-rename-tag
        - github.remotehub
        - github.vscode-github-actions
        - hverlin.mise-vscode
        - mathematic.vscode-latex
        - ms-ossdata.vscode-pgsql
        - ms-vscode-remote.remote-ssh
        - ms-vscode-remote.remote-ssh-edit
        - ms-vscode.remote-explorer
        - ms-vscode.remote-repositories
        - oderwat.indent-rainbow
        - pierrecomputer.pierre-theme
        - pkief.material-icon-theme
        - ritwickdey.liveserver
        - selemondev.vscode-shadcn-svelte
        - svelte.svelte-vscode
        - tomoki1207.pdf
        - usernamehw.errorlens
        - vitest.explorer
    - name: Work
      location: "-1f17a7bd"
      icon: briefcase
      useDefaultFlags: {}
      extensions:
        - aaron-bond.better-comments
        - angular.ng-template
        - anthropic.claude-code
        - biomejs.biome
        - bruno-api-client.bruno
        - dbcode.dbcode
        - diemasmichiels.emulate
        - formulahendry.auto-close-tag
        - formulahendry.auto-rename-tag
        - oderwat.indent-rainbow
        - pierrecomputer.pierre-theme
        - pkief.material-icon-theme
        - pranaygp.vscode-css-peek
        - ritwickdey.liveserver
        - usernamehw.errorlens
        - webnative.webnative
