name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: No plaintext credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans history, not just the tip, so a credential removed
          # in the most recent commit is still found in the commit before it.
          fetch-depth: 0

      # The repo is public and every file under home/ lands in $HOME on every
      # machine. Encrypted secrets (home/**/encrypted_*.age) are ciphertext
      # to a random age key and don't match any rule; a plaintext one would.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apply:
    name: chezmoi apply (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # The real thing, not a model of it: init renders .chezmoi.toml.tmpl,
      # apply renders every template and .chezmoiignore for this OS and
      # writes the result into a scratch home, verify checks it landed.
      # Scripts (package installs) and encrypted files (no key here) are
      # the two things left out.
      - name: Apply into a scratch home (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          dest="$RUNNER_TEMP/home"; mkdir -p "$dest"
          chezmoi init --source "$GITHUB_WORKSPACE" --no-tty
          chezmoi apply --destination "$dest" --exclude scripts,encrypted --no-tty
          chezmoi verify --destination "$dest" --exclude scripts,encrypted
          chezmoi managed --destination "$dest" --exclude scripts,encrypted,dirs

          # modify_dot_claude.json must have merged every server in mcp.yaml.
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert 'dbhub' in d['mcpServers'], d" "$dest/.claude.json"

          # Every script must render to valid bash on this OS (or to nothing).
          for f in home/.chezmoiscripts/*.sh.tmpl; do
            out=$(chezmoi execute-template < "$f")
            [ -z "${out//[[:space:]]/}" ] && continue
            printf '%s\n' "$out" | bash -n || { echo "::error file=$f::renders to invalid bash"; exit 1; }
          done

      - name: Apply into a scratch home (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$HOME\bin'"
          $env:PATH = "$HOME\bin;$env:PATH"
          $dest = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          chezmoi init --source $env:GITHUB_WORKSPACE --no-tty
          chezmoi apply --destination $dest --exclude scripts,encrypted --no-tty
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          chezmoi verify --destination $dest --exclude scripts,encrypted
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          chezmoi managed --destination $dest --exclude scripts,encrypted,dirs

          # Every script must render to valid PowerShell on Windows (or to nothing).
          foreach ($f in Get-ChildItem home/.chezmoiscripts/*.ps1.tmpl) {
            $out = Get-Content -Raw $f | chezmoi execute-template
            if (-not ($out -join '').Trim()) { continue }
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseInput(($out -join "`n"), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { Write-Output "::error file=$f::$($errs[0].Message)"; exit 1 }
          }

  agents:
    name: CLAUDE.md is AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: diff CLAUDE.md AGENTS.md
      # The global one too: ~/.claude/CLAUDE.md must link to its AGENTS.md.
      - run: test "$(cat home/dot_claude/symlink_CLAUDE.md)" = AGENTS.md

  save-scripts:
    name: save's list rewriters keep the YAML valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # `save` rewrites skills.yaml and vscode.yaml with string splicing.
      # Feed both scripts a fake home, then check that chezmoi still parses
      # the data and reads back exactly what the fake home holds.
      - name: Run both against a fake home
        shell: bash
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          fake="$RUNNER_TEMP/fakehome"
          mkdir -p "$fake/.agents" "$fake/.vscode/extensions"
          printf '%s' '{"version":3,"skills":{"b-skill":{"source":"o/r"},"a-skill":{"source":"o/r"},"c-skill":{"source":"x/y"}}}' > "$fake/.agents/.skill-lock.json"
          printf '%s' '[{"identifier":{"id":"pub.default"}}]' > "$fake/.vscode/extensions/extensions.json"
          for loc in $(grep -oP '^\s+location: "\K[^"]+' home/.chezmoidata/vscode.yaml); do
            mkdir -p "$fake/.config/Code/User/profiles/$loc"
            printf '[{"identifier":{"id":"pub.%s"}},{"identifier":{"id":"pub.%s"}}]' "$loc" "$loc" > "$fake/.config/Code/User/profiles/$loc/extensions.json"
          done
          HOME="$fake" node scripts/skills-save.mjs
          HOME="$fake" node scripts/vscode-save-extensions.mjs
          git diff --stat

          chezmoi init --source "$GITHUB_WORKSPACE" --no-tty
          skills=$(chezmoi execute-template '{{ .skills | toJson }}')
          test "$skills" = '{"o/r":["a-skill","b-skill"],"x/y":["c-skill"]}' || { echo "skills: $skills"; exit 1; }
          test "$(chezmoi execute-template '{{ .vscode.extensions | toJson }}')" = '["pub.default"]'
          chezmoi execute-template '{{ range .vscode.profiles }}{{ .location }}={{ .extensions | toJson }}{{ "\n" }}{{ end }}' |
            while IFS='=' read -r loc exts; do
              test "$exts" = "[\"pub.$loc\"]" || { echo "profile $loc: $exts"; exit 1; }
            done
